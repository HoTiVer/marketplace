services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      API_INTERNAL_URL: http://marketplace-backend:8080
    ports:
      - "3000:3000"
    networks:
      - local

networks:
  local:
    external: true
    name: local